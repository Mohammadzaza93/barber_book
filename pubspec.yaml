name: barber_app
description: Barbershop & salon appointment booking app (Arabic/English, Firebase backend).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization / intl
  intl: any

  # State management
  provider: ^6.1.2

  # Firebase
  # firebase_core must be >= 3.15.2. 3.15.0 ships an Android plugin built
  # against the pigeon channel names of firebase_core_platform_interface 6.x
  # while declaring a 5.x constraint, so the Dart and native channels disagree
  # and initializeApp fails with
  # "PlatformException(channel-error, Unable to establish connection on channel)".
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.1
  cloud_functions: ^5.1.3
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5

  # Notifications / reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.2

  # Sharing / deep links
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Media & files
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Utils
  uuid: ^4.5.1
  cross_file: ^0.3.4
  shared_preferences: ^2.3.2

  # Brand assets
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  # Used by test/widget_test.dart so the widget tree can be pumped without a
  # real Firebase app. Test-only, never shipped. Must stay in step with the
  # constraint declared by firebase_core; pinning it lower forces pub to pick a
  # firebase_core whose native channels do not match.
  firebase_core_platform_interface: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'assets/brand/icon_full.png'
  adaptive_icon_background: '#0B0B0D'
  adaptive_icon_foreground: 'assets/brand/icon_foreground.png'
  adaptive_icon_monochrome: 'assets/brand/icon_foreground.png'
  web:
    generate: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/logo.svg
