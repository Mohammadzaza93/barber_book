name: barber_app
description: Barbershop & salon appointment booking app (Arabic/English, Firebase backend).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization / intl
  intl: any

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5

  # Notifications / reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.2

  # Sharing / deep links
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Media & files
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Utils
  uuid: ^4.5.1
  cross_file: ^0.3.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
