plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is credential driven and never falls back to the debug key.
// android/key.properties is git ignored. When it is absent the release variant
// is built UNSIGNED, which keeps `flutter build apk --release` reproducible on
// a clean machine instead of silently producing a debug signed artifact.
def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file("key.properties")
def hasReleaseSigning = releaseSigningFile.exists()
if (hasReleaseSigning) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
    def required = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    def missing = required.findAll { !releaseSigningProperties[it] }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "android/key.properties is present but incomplete. Missing: ${missing.join(', ')}"
        )
    }
}

android {
    namespace = "com.barberbook.barberbook"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.barberbook.barberbook"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseSigningProperties["storeFile"])
                storePassword = releaseSigningProperties["storePassword"]
                keyAlias = releaseSigningProperties["keyAlias"]
                keyPassword = releaseSigningProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Only ever a real release key, or nothing at all. Never signingConfigs.debug.
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
